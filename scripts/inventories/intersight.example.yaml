# Cisco Intersight Inventory Example
# This file represents managed servers from Cisco Intersight

kind: Intersight
apiVersion: v1

servers:
  - name: "pod-11-cimc-1"
    hostname: "pod-11-cimc-1.example.com"
    management_ip: "192.168.100.11"
    type: "C240 M5"
    
  - name: "pod-11-cimc-2"
    hostname: "pod-11-cimc-2.example.com"
    management_ip: "192.168.100.12"
    type: "C240 M5"
    
  - name: "pod-12-cimc-1"
    hostname: "pod-12-cimc-1.example.com"
    management_ip: "192.168.100.21"
    type: "C240 M6"
    
  - name: "pod-12-cimc-2"
    hostname: "pod-12-cimc-2.example.com"
    management_ip: "192.168.100.22"
    type: "C240 M6"

# Virtual management endpoints
virtual_endpoints:
  - name: "intersight-controller"
    hostname: "intersight.example.com"
    ip: "192.168.100.50"
