    under 01-nd-cluster/automation/scripts/. Phase 3 will replace
    shell-outs with native modules from cisco.aipod.

  license: Apache-2.0
  min_ansible_version: "2.15"

  platforms:
    - name: GenericLinux
      versions:
        - all

  galaxy_tags:
