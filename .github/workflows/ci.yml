---
name: CI

permissions:
  contents: read

env:
  ORIGIN_PYTHON_VERSION: "3.12"

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

'on':
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ansible-lint:
    runs-on: ubuntu-24.04
    env:
      LINT_VER: 24.12.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.ORIGIN_PYTHON_VERSION }}

      - name: Install ansible-lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-lint==${LINT_VER}"

      - name: Run ansible-lint
        run: ansible-lint --profile=production --skip-list sanity .
  all_green:
    if: ${{ always() }}
    needs:
      - ansible-lint
    runs-on: ubuntu-24.04
    steps:
      - run: >-
          python -c "assert '${{ needs.ansible-lint.result }}' == 'success'"
