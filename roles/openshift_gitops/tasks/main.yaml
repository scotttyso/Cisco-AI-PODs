---
- name: Verify Required Environment Variables Are Set
  ansible.builtin.assert:
    that:
      - >-
        (lookup('ansible.builtin.env', 'K8S_AUTH_KUBECONFIG') | length > 0)
        or (lookup('ansible.builtin.env', 'KUBECONFIG') | length > 0)
        or (
          (lookup('ansible.builtin.env', 'openshift_token_id') | length > 0)
          and (lookup('ansible.builtin.env', 'openshift_api_url') | length > 0)
        )
    fail_msg: "OpenShift authentication is not configured. Set K8S_AUTH_KUBECONFIG or KUBECONFIG, or export both openshift_token_id and openshift_api_url."

- name: Default the GitOps Repository URL to the In-Cluster Gitea Repository
  ansible.builtin.set_fact:
    openshift: >-
      {{
        openshift | combine({'operators': {'openshift_gitops': {'gitops_repo_url':
          'https://gitea-with-admin-gitea-operator.apps.' ~ openshift.cluster_name ~ '.' ~ openshift.base_dns_domain
          ~ '/lab-user/openshift-gitops-repo.git'}}}, recursive=True)
      }}
  when:
    - (openshift.operators.gitea.enable | default(false)) | bool
    - (openshift.operators.openshift_gitops.gitops_repo_url | default('')) | length == 0
    - openshift.cluster_name is defined
    - openshift.base_dns_domain is defined

- name: Validate Required GitOps Configuration
  ansible.builtin.assert:
    that:
      - openshift.operators.openshift_gitops is defined
      - openshift.operators.openshift_gitops.gitops_repo_url is defined
      - openshift.operators.openshift_gitops.gitops_repo_url | length > 0
    fail_msg: "Required value missing: openshift.operators.openshift_gitops.gitops_repo_url"

- name: Set Facts for OpenShift GitOps (ArgoCD)
  ansible.builtin.set_fact:
    destination_directory: "{{ openshift.destination_directory | default('/tmp/openshift-gitops') }}"
    mac_vlan_list: "{{ openshift.operators.nvidia_network_operator.mac_vlan | default([]) }}"
    operator_list: "{{ openshift.operators.operators_to_install | default([]) }}"

- name: Add LLDP DaemonSet and NMState to Operator List
  ansible.builtin.set_fact:
    operator_list: >-
      {{
        operator_list | union([
          'lldpd',
          'openshift-nmstate'
        ])
      }}

- name: Add the NVIDIA GPU Operator When the NVIDIA NIM Operator Is in Operator List
  ansible.builtin.set_fact:
    operator_list: "{{ operator_list | union(['nvidia-gpu-operator']) }}"
  when: "'nvidia-nim-operator' in operator_list"

- name: Add Required Operators When Red Hat OpenShift AI Is in Operator List
  ansible.builtin.set_fact:
    operator_list: >-
      {{
        operator_list | union([
          'cert-manager-operator',
          'external-secrets-operator',
          'nvidia-gpu-operator',
          'nvidia-network-operator',
          'openshift-cluster-observability-operator',
          'openshift-connectivity-link',
          'openshift-jobset-operator',
          'openshift-keda',
          'openshift-kmm',
          'openshift-kueue-operator',
          'openshift-lws-operator',
          'openshift-nfd',
          'openshift-opentelemetry-operator',
          'openshift-sriov-network-operator',
          'openshift-tempo-operator'
        ])
      }}
  when: "'redhat-ods-operator' in operator_list"

- name: If NVIDIA GPU or Network Operator is in Operator List, Add Node Feature Discovery Operator to Operator List
  ansible.builtin.set_fact:
    operator_list: >-
      {{
        operator_list | union([
          'openshift-nfd'
        ])
      }}
  when: "'nvidia-gpu-operator' in operator_list or 'nvidia-network-operator' in operator_list"

- name: Generate NVIDIA AI Enterprise Support Matrix JSON
  ansible.builtin.command:
    cmd: >-
      python3 {{ role_path | regex_replace('/roles/[^/]+$', '') }}/scripts/nvidia_support_matrix.py
      --format json
      --version {{ openshift.nvidia_ai_enterprise_version | default('8.1') }}
      --output-file /tmp/nvidia_ai_enterprise_matrix.json
  changed_when: false
  when: "'nvidia-gpu-operator' in operator_list or 'nvidia-network-operator' in operator_list"

- name: Read NVIDIA AI Enterprise Support Matrix JSON
  ansible.builtin.slurp:
    src: /tmp/nvidia_ai_enterprise_matrix.json
  register: nvidia_matrix_file
  when: "'nvidia-gpu-operator' in operator_list or 'nvidia-network-operator' in operator_list"

- name: Set NVIDIA AI Enterprise Fact
  ansible.builtin.set_fact:
    nvidia_ai_enterprise: "{{ nvidia_matrix_file.content | b64decode | from_json }}"
  when: "'nvidia-gpu-operator' in operator_list or 'nvidia-network-operator' in operator_list"

- name: Remove Temporary NVIDIA AI Enterprise Matrix JSON File
  ansible.builtin.file:
    path: /tmp/nvidia_ai_enterprise_matrix.json
    state: absent
  when: "'nvidia-gpu-operator' in operator_list or 'nvidia-network-operator' in operator_list"

- name: Ensure the Destination Directory Exists
  ansible.builtin.file:
    mode: '0755'
    path: "{{ destination_directory }}"
    state: directory

- name: Ensure that the `apps` and `helm` Directories Exist
  ansible.builtin.file:
    mode: '0755'
    path: "{{ destination_directory }}/{{ item }}"
    state: directory
  loop:
    - apps
    - helm

- name: Copy Operator Apps Directories to Destination Directory
  ansible.builtin.copy:
    dest: "{{ destination_directory }}/apps/{{ item }}"
    src: "{{ role_path }}/apps/{{ item }}"
    mode: '0755'
    remote_src: true
  loop: "{{ operator_list }}"
  when: item not in ['nvidia-gpu-operator', 'redhat-ods-operator']

- name: Copy Operator Helm Directories to Destination Directory
  ansible.builtin.copy:
    dest: "{{ destination_directory }}/helm/{{ item }}"
    src: "{{ role_path }}/helm/{{ item }}"
    mode: '0755'
    remote_src: true
  loop: "{{ operator_list }}"
  when: item in ['nvidia-gpu-operator', 'redhat-ods-operator']

- name: Create Destination Directories for NVIDIA GPU Operator & Red Hat OpenShift AI
  ansible.builtin.file:
    path: "{{ destination_directory }}/apps/{{ item }}"
    mode: '0755'
    state: directory
  loop: "{{ operator_list }}"
  when: item in ['nvidia-gpu-operator', 'redhat-ods-operator']

- name: Create the Ansible Automation Platform - AnsibleAutomationPlatform and ConsoleLink from Template
  ansible.builtin.copy:
    content: "{{ lookup('template', item + '.yaml.j2') }}"
    dest: "{{ destination_directory }}/apps/aap/{{ item }}.yaml"
    mode: '0755'
  loop:
    - ansible-automation-platform
    - console-link-app
  when: "'aap' in operator_list"

- name: Create the OpenShift GitOps (ArgoCD) ApplicationSet Template
  ansible.builtin.copy:
    content: "{{ lookup('template', 'cisco-ai-pods-apps.yaml.j2') }}"
    dest: "{{ destination_directory }}/cisco-ai-pods-apps.yaml"
    mode: '0755'

- name: Create the Application Manifest for the NVIDIA GPU Operator & Red Hat OpenShift AI from Template
  ansible.builtin.copy:
    content: "{{ lookup('template', item + '.yaml.j2') }}"
    dest: "{{ destination_directory }}/apps/{{ item }}/{{ item }}.yaml"
    mode: '0755'
  loop: "{{ operator_list }}"
  when: item in ['nvidia-gpu-operator', 'redhat-ods-operator']

- name: Create the NVIDIA Network Operator - MAC VLAN YAML Files from Template
  ansible.builtin.copy:
    content: "{{ lookup('template', 'mac-vlan.yaml.j2') }}"
    dest: "{{ destination_directory }}/apps/nvidia-network-operator/mac-vlan-policy-{{ item.master_interface }}.yaml"
    mode: '0755'
  loop: "{{ mac_vlan_list }}"
  loop_control:
    index_var: item_index
  when: "'nvidia-network-operator' in operator_list and (mac_vlan_list | length > 0)"

- name: Create the NVIDIA GPU Operator Helm Values file from Template
  ansible.builtin.copy:
    content: "{{ lookup('template', 'nvidia-gpu-operator-values.yaml.j2') }}"
    dest: "{{ destination_directory }}/helm/nvidia-gpu-operator/values.yaml"
    mode: '0755'
  when: "'nvidia-gpu-operator' in operator_list"

- name: Create the NVIDIA NIM Operator Subscription from Template
  ansible.builtin.copy:
    content: "{{ lookup('template', 'nvidia-nim-operator-subscription.yaml.j2') }}"
    dest: "{{ destination_directory }}/apps/nvidia-nim-operator/subscription.yaml"
    mode: '0755'
  when: "'nvidia-nim-operator' in operator_list"

- name: Create the NVIDIA Network Operator - NIC Cluster Policy from Template
  ansible.builtin.copy:
    content: "{{ lookup('template', 'nic-cluster-policy.yaml.j2') }}"
    dest: "{{ destination_directory }}/apps/nvidia-network-operator/nic-cluster-policy.yaml"
    mode: '0755'
  when: "'nvidia-network-operator' in operator_list and (mac_vlan_list | length > 0)"

- name: Create the SRIOV Operator Config file from Template
  ansible.builtin.copy:
    content: "{{ lookup('template', 'sriov-operator-config.yaml.j2') }}"
    dest: "{{ destination_directory }}/apps/openshift-sriov-network-operator/sriov-operator-config.yaml"
    mode: '0755'
  when: "'openshift-sriov-network-operator' in operator_list"
