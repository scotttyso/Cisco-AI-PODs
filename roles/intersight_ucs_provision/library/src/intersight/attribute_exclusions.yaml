# Attribute Exclusion Configuration for check_template_differences.py
# 
# This file allows you to configure which attributes should be excluded from
# difference reports. This is useful for filtering out read-only, system-managed,
# or policy-specific attributes that don't need to be tracked as part of
# template maintenance.
#
# Usage: check_template_differences.py --config attribute_exclusions.yaml

# Global exclusions apply to all policies
# These are attributes that are system-managed or read-only in Intersight
global_exclusions:
  # Identifiers and type information
  - Moid
  - ObjectType
  - ClassId
  - AccountMoid
  - AccountMoidList
  
  # Timestamps (read-only)
  - CreateTime
  - ModTime
  - UpdateTime
  - LastModifiedTime
  
  # Hierarchy and relationships (typically managed by Intersight)
  - Ancestors
  - DomainGroupMoid
  - Owners
  - PermissionResources
  - Parent
  
  # Sharing and versioning (system-managed)
  - Shared
  - SharedScope
  - VersionContext
  - Tags
  
  # Description and Name (optional/informational)
  - Description
  - Name
  - Organization
  
  # References and relationships (ignore Profiles in all policies)
  # Profiles is a read-only list of references managed by Intersight
  - Profiles
  
  # Reference-only attributes that don't need template support
  - Groups
  - Providers

# Per-policy-type exclusions
# These apply to specific policy types and supplement the global exclusions
policy_exclusions:
  # VLAN-specific exclusions
  vlan:
    # Template uses these as part of nested tag structure, not direct attributes
    - Key
    - Type
    - Value
  
  # Switch Control-specific exclusions
  switch_control:
    # IsAesPrimaryKeySet is a read-only indicator - AesPrimaryKey must be set directly
    # Users cannot query or set this value; it indicates whether AesPrimaryKey is defined
    - IsAesPrimaryKeySet
  
  # Storage-specific exclusions
  storage:
    # DriveGroup is a reference-only attribute managed by Intersight
    - DriveGroup
  
  # Fibre Channel Network-specific exclusions
  fibre_channel_network:
    # VsanSettings appears to be legacy/custom and not in current API
    - VsanSettings
  
  # Ethernet Network-specific exclusions
  ethernet_network:
    # VlanSettings appears to be legacy/custom and not in current API
    - VlanSettings
