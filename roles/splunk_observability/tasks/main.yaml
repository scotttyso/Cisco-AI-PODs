---
- name: Resolve Splunk Observability Access Token
  ansible.builtin.set_fact:
    splunk_observability_access_token_value: "{{ lookup('ansible.builtin.env', 'splunk_observability_access_token_' ~ (splunk_observability.access_token | string), default=lookup('ansible.builtin.env', 'splunk_observability_token', default='')) | trim }}"

- name: Resolve Splunk Platform HEC Token
  ansible.builtin.set_fact:
    splunk_platform_token_value: "{{ lookup('ansible.builtin.env', 'splunk_platform_token_' ~ (splunk_observability.splunk_platform.token | string), default=lookup('ansible.builtin.env', 'splunk_platform_token', default='')) | trim }}"

- name: Resolve Splunk Observability Realm
  ansible.builtin.set_fact:
    splunk_observability_realm_value: "{{ lookup('ansible.builtin.env', 'splunk_observability_realm', default=(splunk_observability.realm | default(splunk_observability.splunk_realm | default('us0')))) | trim }}"

- name: Verify Required Environment Variables Are Set
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'openshift_token_id') | length > 0
      - lookup('ansible.builtin.env', 'openshift_api_url') | length > 0
      - splunk_observability_access_token_value | length > 0
      - splunk_platform_token_value | length > 0
      - splunk_observability_realm_value | length > 0
    fail_msg: "Required environment variables not set: openshift_token_id, openshift_api_url, and either token-id vars (splunk_observability_access_token_<token_id>, splunk_platform_token_<token_id>) or fallback vars (splunk_observability_token, splunk_platform_token)."

- name: Show Effective Splunk Observability Realm
  ansible.builtin.debug:
    msg: "Using Splunk Observability realm '{{ splunk_observability_realm_value }}' for signalfx ingestion."

- name: Create Otel Operator Namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: otel
    state: present
    validate_certs: "{{ validate_certificates | default(false) }}"

- name: Determine if ETCD Metrics Collection is Requested
  ansible.builtin.set_fact:
    splunk_observability_etcd_metrics_requested: "{{ (splunk_observability.otel_collector.metrics_collection | default({})).get('etcd_metrics', false) | bool }}"

- name: Check for ETCD Metrics Client Secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: etcd-metric-client
    namespace: openshift-etcd
    validate_certs: "{{ validate_certificates | default(false) }}"
  register: splunk_etcd_metric_client_secret
  changed_when: false
  failed_when: false
  when: splunk_observability_etcd_metrics_requested

- name: Check for ETCD Metrics Signer Secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: etcd-metric-signer
    namespace: openshift-etcd
    validate_certs: "{{ validate_certificates | default(false) }}"
  register: splunk_etcd_metric_signer_secret
  changed_when: false
  failed_when: false
  when: splunk_observability_etcd_metrics_requested

- name: Determine if ETCD Metrics Collection Can Be Enabled
  ansible.builtin.set_fact:
    splunk_observability_etcd_metrics_enabled: >-
      {{
        splunk_observability_etcd_metrics_requested | bool and
        (splunk_etcd_metric_client_secret.resources | default([]) | length > 0) and
        (splunk_etcd_metric_signer_secret.resources | default([]) | length > 0)
      }}

- name: Warn When ETCD Metrics Requested But Required Secrets Are Missing
  ansible.builtin.debug:
    msg: >-
      ETCD metrics were requested but required secrets were not found in openshift-etcd namespace
      (expected: etcd-metric-client and etcd-metric-signer). Continuing without ETCD metrics.
  when:
    - splunk_observability_etcd_metrics_requested | bool
    - not splunk_observability_etcd_metrics_enabled | bool

- name: Run ETCD Tasks if ETCD Metrics Collection is Enabled
  ansible.builtin.include_tasks: etcd.yaml
  when: splunk_observability_etcd_metrics_enabled | bool

- name: Add Splunk Otel Collector Chart Repository
  kubernetes.core.helm_repository:
    name: splunk-otel-collector-chart
    repo_url: https://signalfx.github.io/splunk-otel-collector-chart
    state: present
    validate_certs: "{{ validate_certificates | default(false) }}"

- name: Set Fact for Proxy Password if provided
  ansible.builtin.set_fact:
    proxy_password: "{{ lookup('ansible.builtin.env', 'proxy_password_' ~ (splunk_observability.otel_collector.proxy.password | string)) }}"
  when: |-
    splunk_observability.otel_collector is defined and
    splunk_observability.otel_collector.proxy is defined and
    splunk_observability.otel_collector.proxy.password is defined

- name: Set Fact for Everpure Storage Array Password
  ansible.builtin.set_fact:
    "{{ 'everpure_api_token_' ~ (item.api_token_id | string) }}": "{{ lookup('ansible.builtin.env', 'everpure_api_token_' ~ (item.api_token_id | string)) }}"
  loop: "{{ splunk_observability.otel_collector.everpure_flash_arrays | default([]) }}"
  when: |-
    splunk_observability.otel_collector is defined and
    splunk_observability.otel_collector.everpure_flash_arrays is defined

- name: Create Splunk Otel Collector values.yaml from Template
  ansible.builtin.template:
    src: otel-values.yaml.j2
    dest: "{{ role_path }}/values.yaml"
    mode: '0644'

- name: Check Existing Splunk Otel Collector Release
  kubernetes.core.helm_info:
    name: splunk-otel-collector
    release_namespace: otel
    validate_certs: "{{ validate_certificates | default(false) }}"
  register: splunk_otel_collector_release
  changed_when: false
  failed_when: false

- name: Delete Existing Splunk Otel Collector Release
  kubernetes.core.helm:
    name: splunk-otel-collector
    release_namespace: otel
    state: absent
    validate_certs: "{{ validate_certificates | default(false) }}"
  when: splunk_otel_collector_release.releases is defined and splunk_otel_collector_release.releases | length > 0

- name: Install Splunk Otel Collector Chart
  kubernetes.core.helm:
    chart_ref: splunk-otel-collector-chart/splunk-otel-collector
    name: splunk-otel-collector
    release_namespace: otel
    state: present
    disable_hook: true
    release_values:
      clusterName: "{{ splunk_observability.openshift_cluster.cluster_name }}"
      environment: "{{ splunk_observability.openshift_cluster.environment }}"
      splunkObservability:
        accessToken: "{{ splunk_observability_access_token_value }}"
        realm: "{{ splunk_observability_realm_value }}"
      splunkPlatform:
        endpoint: "{{ splunk_observability.splunk_platform.endpoint | default('https://customer.splunkcloud.com') }}/services/collector/event"
        index: "{{ splunk_observability.splunk_platform.index | default('my-index') }}"
        token: "{{ splunk_platform_token_value }}"
    update_repo_cache: true
    validate_certs: "{{ validate_certificates | default(false) }}"
    values_files:
      - "{{ role_path }}/values.yaml"
    wait: true

- name: Delete Generated Files / Directories
  ansible.builtin.file:
    path: "{{ role_path }}/{{ item }}"
    state: absent
  loop:
    - client
    - signer
    - values.yaml

- name: Run Intersight Tasks When Intersight is Enabled
  ansible.builtin.include_tasks: intersight.yaml
  when: splunk_observability.intersight.enable | default(false) | bool

- name: Run Nexus Tasks When Nexus is Defined
  ansible.builtin.include_tasks: nexus.yaml
  when: splunk_observability.nexus is defined
