---
- name: Install HTTPS Web Server Packages
  ansible.builtin.package:
    name: "{{ provisioning_web_packages }}"
    state: present

- name: Create Provisioning Image Directory
  ansible.builtin.file:
    path: "{{ provisioning_web_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Provisioning TLS Directory
  ansible.builtin.file:
    path: "{{ provisioning_web_tls_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Generate Provisioning TLS Private Key
  community.crypto.openssl_privatekey:
    path: "{{ provisioning_web_tls_private_key_path }}"
    owner: root
    group: root
    mode: "0600"
  when: provisioning_web_tls_self_signed | bool
  notify: Restart Provisioning Web Service

- name: Generate Provisioning TLS Certificate Request
  community.crypto.openssl_csr:
    path: "{{ provisioning_web_tls_csr_path }}"
    privatekey_path: "{{ provisioning_web_tls_private_key_path }}"
    common_name: "{{ provisioning_web_server_name }}"
    subject_alt_name: "{{ provisioning_web_tls_subject_alt_name }}"
    owner: root
    group: root
    mode: "0644"
  when: provisioning_web_tls_self_signed | bool
  notify: Restart Provisioning Web Service

- name: Generate Self-Signed Provisioning TLS Certificate
  community.crypto.x509_certificate:
    path: "{{ provisioning_web_tls_certificate_path }}"
    privatekey_path: "{{ provisioning_web_tls_private_key_path }}"
    csr_path: "{{ provisioning_web_tls_csr_path }}"
    provider: selfsigned
    owner: root
    group: root
    mode: "0644"
  when: provisioning_web_tls_self_signed | bool
  notify: Restart Provisioning Web Service

- name: Check Provisioning TLS Files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ provisioning_web_tls_certificate_path }}"
    - "{{ provisioning_web_tls_private_key_path }}"
  register: provisioning_web_tls_files

- name: Validate Provisioning TLS Files
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Provisioning TLS file '{{ item.item }}' does not exist."
  loop: "{{ provisioning_web_tls_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Configure HTTPS Provisioning Image Service
  ansible.builtin.template:
    src: provisioning-images.conf.j2
    dest: "{{ provisioning_web_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Provisioning Web Service

- name: Validate Nginx Configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and Start Provisioning Web Service
  ansible.builtin.service:
    name: "{{ provisioning_web_service_name }}"
    enabled: true
    state: started

- name: Configure HTTPS Firewall Access
  when: provisioning_web_manage_firewall | bool
  block:
    - name: Select Firewall Backend
      ansible.builtin.set_fact:
        provisioning_web_effective_firewall_backend: >-
          {{ provisioning_web_firewall_backend if provisioning_web_firewall_backend != 'auto'
             else ('ufw' if ansible_os_family == 'Debian'
             else ('firewalld' if ansible_os_family in ['RedHat', 'Suse'] else 'none')) }}

    - name: Install Firewall Package
      ansible.builtin.package:
        name: "{{ provisioning_web_effective_firewall_backend }}"
        state: present
      when: provisioning_web_effective_firewall_backend in ['ufw', 'firewalld']

    - name: Enable and Start firewalld
      ansible.builtin.service:
        name: firewalld
        enabled: true
        state: started
      when: provisioning_web_effective_firewall_backend == 'firewalld'

    - name: Open HTTPS with UFW
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp
      when: provisioning_web_effective_firewall_backend == 'ufw'

    - name: Open HTTPS with firewalld
      ansible.posix.firewalld:
        service: https
        zone: "{{ provisioning_web_firewall_zone | default(omit, true) }}"
        permanent: true
        immediate: true
        state: enabled
      when: provisioning_web_effective_firewall_backend == 'firewalld'

    - name: Report Unmanaged Firewall
      ansible.builtin.debug:
        msg: >-
          No automatic firewall backend is known for {{ ansible_os_family }};
          allow TCP port 443 or set provisioning_web_firewall_backend.
      when: provisioning_web_effective_firewall_backend == 'none'
