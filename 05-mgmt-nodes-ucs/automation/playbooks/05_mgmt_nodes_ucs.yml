---
# Subsystem 05 - UCS management nodes
#
# Tier 2 playbook in the four-tier model (aipod-architecture skill):
#   Tier 4: playbooks/deploy_aipod.yml
#   Tier 3: playbooks/domains/compute.yml
#   Tier 2: this file
#   Tier 1: roles/mgmt_nodes_ucs

- name: "Subsystem 05 - UCS management nodes"
  hosts: localhost
  gather_facts: false
  vars_files:
    - >-
      {{ aipod_vault_file | default(
           inventory_dir ~ '/group_vars/vault.yml'
         ) }}
  roles:
    - role: cisco.aipod.mgmt_nodes_ucs
