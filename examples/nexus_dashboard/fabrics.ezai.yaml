---
# Multiple Nexus Dashboard Fabric Definitions
# Define multiple fabrics with their settings and switches in a single file
# yaml-language-server: $schema=../../schema/cisco-ai-pods.json
nexus_dashboard:
  fabrics:
    - name: "production-classic"
      type: "classicLan"
      licenseTier: "essentials"
      fabric_settings:
        monitoredMode: false
        inbandManagement: false
        softwareUpdateMode: false
        snmpTrap: true
        coppPolicy: manual
      telemetry:
        telemetryCollection: false
        telemetryMode: outofband
        telemetryVrf: management
        telemetrySourceInterface: mgmt0
        snmpTrap: true
      switches:
        - ip: "10.1.1.10"
          hostname: "leaf1"
          model: "N9K-C93180YC-FX"
          serialNumber: "SAL1234ABCD"
          softwareVersion: "10.3(3)"
        - ip: "10.1.1.11"
          hostname: "leaf2"
          model: "N9K-C93180YC-FX"
          serialNumber: "SAL1234ABCE"
          softwareVersion: "10.3(3)"
        - ip: "10.1.1.1"
          hostname: "spine1"
          model: "N9K-C93180YC-FX"
          serialNumber: "SAL1234SPINE1"
          softwareVersion: "10.3(3)"
        - ip: "10.1.1.2"
          hostname: "spine2"
          model: "N9K-C93180YC-FX"
          serialNumber: "SAL1234SPINE2"
          softwareVersion: "10.3(3)"

    - name: "production-vxlan"
      type: "vxlanEbgp"
      licenseTier: "advantage"
      fabric_settings:
        bgpAsn: 65001
        fabricMtu: 9216
        firstHopRedundancyProtocol: hsrp
        networkVlanRange: "2300-2999"
        snmpTrap: true
        nxapi: true
      telemetry:
        telemetryCollection: true
        telemetryMode: outofband
        telemetryVrf: management
        telemetrySourceInterface: mgmt0
        snmpTrap: true
      switches:
        - ip: "10.2.1.10"
          hostname: "leaf1"
          model: "N9K-C93180YC-FX"
          serialNumber: "SAL2000ABCD"
          softwareVersion: "10.3(3)"
          switchRole: "leaf"
        - ip: "10.2.1.11"
          hostname: "leaf2"
          model: "N9K-C93180YC-FX"
          serialNumber: "SAL2000ABCE"
          softwareVersion: "10.3(3)"
          switchRole: "leaf"
        - ip: "10.2.1.1"
          hostname: "spine1"
          model: "N9K-C93180YC-FX"
          serialNumber: "SAL2000SPINE1"
          softwareVersion: "10.3(3)"
          switchRole: "spine"
        - ip: "10.2.1.2"
          hostname: "spine2"
          model: "N9K-C93180YC-FX"
          serialNumber: "SAL2000SPINE2"
          softwareVersion: "10.3(3)"
          switchRole: "spine"

    - name: "ai-routed-fabric"
      type: "aiRouted"
      licenseTier: "premier"
      fabric_settings:
        softwareUpdateMode: true
        snmpTrap: true
        nxapi: true
        coppPolicy: strict
      telemetry:
        telemetryCollection: true
        telemetryMode: outofband
        telemetryVrf: management
        telemetrySourceInterface: mgmt0
        snmpTrap: true
      switches:
        - ip: "10.3.1.10"
          hostname: "ai-leaf1"
          model: "N9K-C93180YC-FX"
          serialNumber: "SAL3000ABCD"
          softwareVersion: "10.3(3)"
          switchRole: "leaf"
        - ip: "10.3.1.11"
          hostname: "ai-leaf2"
          model: "N9K-C93180YC-FX"
          serialNumber: "SAL3000ABCE"
          softwareVersion: "10.3(3)"
          switchRole: "leaf"
        - ip: "10.3.1.1"
          hostname: "ai-spine1"
          model: "N9K-C93180YC-FX"
          serialNumber: "SAL3000SPINE1"
          softwareVersion: "10.3(3)"
          switchRole: "spine"

    - name: "ai-vxlan-evpn"
      type: "aiVxlanEvpn"
      licenseTier: "premier"
      # Stage 02 backend-fabric workflow settings (not sent to the ND API as-is).
      backend_settings:
        key: backend
        underlayFirstOctet: 20
        replicationMode: Multicast
        qosPolicy: AI_Fabric_QOS_400G
        ptp: true
        ptpSourceLoopbackId: 0
        ptpDomainId: 0
        bfd: true
        enableAiMlQosPolicy: true
        useRobotPassword: true
        addSwitchesWithoutReload: true
        realTimeBackup: true
        location:
          name: "San Jose, US"
          latitude: 37.3382
          longitude: -121.8863
      fabric_settings:
        bgpAsn: 65002
        fabricMtu: 9216
        softwareUpdateMode: true
        snmpTrap: true
        nxapi: true
        coppPolicy: strict
      telemetry:
        telemetryCollection: true
        telemetryMode: outofband
        telemetryVrf: management
        telemetrySourceInterface: mgmt0
        snmpTrap: true
      # Day-0 POAP: switches boot, pull a bootstrap config from Nexus Dashboard and wait to be
      # claimed by serial number. External DHCP (e.g. the DHCP Bootstrap Kea service with
      # option 66/67 pointing at Nexus Dashboard) is the default.
      poap:
        enabled: true
        dhcp: external
        gateway: 10.4.1.254/24
      switches:
        - ip: "10.4.1.10"
          hostname: "ai-evpn-leaf1"
          model: "N9K-C93180YC-FX"
          serialNumber: "SAL4000ABCD"
          softwareVersion: "10.3(3)"
          switchRole: "leaf"
          username: admin
          fabricLinkInterfaces: ["Ethernet1/1", "Ethernet1/2"]
          hostInterfaces: ["Ethernet1/3", "Ethernet1/4"]
        - ip: "10.4.1.11"
          hostname: "ai-evpn-leaf2"
          model: "N9K-C93180YC-FX"
          serialNumber: "SAL4000ABCE"
          softwareVersion: "10.3(3)"
          switchRole: "leaf"
          username: admin
          fabricLinkInterfaces: ["Ethernet1/1", "Ethernet1/2"]
        - ip: "10.4.1.1"
          hostname: "ai-evpn-spine1"
          model: "N9K-C93180YC-FX"
          serialNumber: "SAL4000SPINE1"
          softwareVersion: "10.3(3)"
          switchRole: "spine"
          username: admin
          fabricLinkInterfaces: ["Ethernet1/1", "Ethernet1/2"]
        - ip: "10.4.1.2"
          hostname: "ai-evpn-spine2"
          model: "N9K-C93180YC-FX"
          serialNumber: "SAL4000SPINE2"
          softwareVersion: "10.3(3)"
          switchRole: "spine"
          username: admin
          fabricLinkInterfaces: ["Ethernet1/1", "Ethernet1/2"]
