        domain:
          - action: Deploy
            attach_template: true
            name: ucsai-1
            serial_numbers:
              - FDO29100001
              - FDO29100002
            ucs_domain_profile_template: XDirect
          - action: Deploy
            attach_template: true
            name: ucsai-2
            serial_numbers:
              - FDO29100003
              - FDO29100004
            ucs_domain_profile_template: XDirect
