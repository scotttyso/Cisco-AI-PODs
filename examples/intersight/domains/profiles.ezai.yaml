    default:
      profiles:
        chassis:
          - action: No-op
            imc_access_policy: KVMAccess
            power_policy: X9508
            targets:
              - name: ucsai-1
                serial_number: FOX29100000
              - name: ucsai-2
                serial_number: FOX29100001
