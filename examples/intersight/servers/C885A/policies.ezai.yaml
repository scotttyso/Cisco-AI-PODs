---
# =========================================================
#   Policies -> C885A - Variables
# =========================================================
intersight:
  configure:
    default:
      policies:
        bios:
          - bios_template: MLPerf-Inference-C885A-M8-AMD
            name: MLPerf-Inference-C885A-M8-AMD
            ipv4http: disabled
            ipv4pxe: disabled
            ipv6http: disabled
            ipv6pxe: disabled
        certificate_management:
          - assigned_sensitive_data: true
            certificates:
              - name: LDAPRootCA
                type: RootCA
                certificate_file: /home/certificates/LDAP-CA.crt
            name: LDAP-Certificates
        ntp:
          - name: NTP
            ntp_servers:
              - 0.pool.ntp.org
              - 1.pool.ntp.org
            timezone: America/New_York
        ipmi_over_lan:
          - name: IPMI
            privilege: admin
        local_user:
          - name: Localusers
            users:
              - password: 1
                role: admin
                username: administrator
        ssh:
          - name: SSH
            ssh_port: 22
        power:
          - name: Power
            power_restore: LastState
            target_platform: Standalone
