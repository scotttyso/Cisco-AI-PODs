                  chassis_id: 1
                  initial_auto_deploy_when_server_is_available: true
                  slot_id: 1
              - name: ucsai-1-3
                pre_assign:
                  chassis_id: 1
                  initial_auto_deploy_when_server_is_available: true
                  slot_id: 4
              - name: ucsai-1-5
                pre_assign:
                  chassis_id: 1
                  initial_auto_deploy_when_server_is_available: true
                  slot_id: 5
