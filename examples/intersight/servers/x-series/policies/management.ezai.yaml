intersight:
  configure:
    default:
      policies:
        # certificate_management:
        #   - assigned_sensitive_data: true
        #     certificates:
        #       - name: LDAPRootCA
        #         type: RootCA
        #         certificate_file: /home/certificates/LDAP-CA.crt
        #     name: LDAP-Certificates
        #   - assigned_sensitive_data: true
        #     certificates:
        #       - name: IMC-Certificate
        #         type: IMC
        #         certificate_file: /home/certificates/IMC-Certificate.crt
        #         private_key_file: /etc/pki/private/IMC-Certificate.key
        #     name: IMC-Certificates
        # =========================================================
        #   Only needed if not used in Chassis Profile
        # =========================================================
        # imc_access:
        #   - inband_ip_pool: Inband
        #     inband_vlan_id: 100
        #     name: KVMAccess
        #     out_of_band_ip_pool: OoBand
        local_user:
          - name: LocalUsers
            password_properties:
              enforce_strong_password: true
              password_history: 0
            users:
              - password: 1
                role: admin
                username: admin
        serial_over_lan:
          - name: SoL
        ipmi_over_lan:
          - encryption_key: 1
            name: IPMIWithEncryption
            privilege: admin
        syslog:
          - local_logging:
              minimum_severity: warning
            name: Syslog
            remote_logging:
              - hostname: 198.18.5.14
                minimum_severity: warning
              - hostname: 198.18.5.15
                minimum_severity: warning
        virtual_kvm:
          - allow_tunneled_vkvm: true
            name: vKVM
