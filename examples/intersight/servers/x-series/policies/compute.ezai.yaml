---
# =========================================================
#   Policies -> Compute - Variables
# =========================================================
intersight:
  configure:
    default:
      policies:
        bios:
          - baud_rate: '115200'
            bios_template: GPUTraining-M8-AMD-Tpm
            console_redirection: com-0
            name: GPUTraining-M8-AMD-Tpm
            serial_port_aenable: enabled
            terminal_type: vt100
        boot_order:
          - boot_devices:
              - device_name: '0'
                device_type: local_disk
                slot: MSTOR-RAID
              - device_name: '1'
                device_type: uefi_shell
            boot_mode: Uefi
            enable_secure_boot: false
            name: M2-Boot
        firmware:
          - name: Recommended
            model_bundle_version:
              - firmware_version: 6.0(2.260040)
                server_models:
                  - UCSX-215C-M8
            target_platform: FIAttached
        # =========================================================
        # PCIe Connectivity Policy
        # =========================================================
        # ⚠️  IMPORTANT FIRMWARE REQUIREMENT
        # PCIe Connectivity policies require a MINIMUM firmware
        # version of 6.0(1.252039) or later.
        #
        # Before enabling this policy:
        # 1. Verify all target servers have firmware >= 6.0(1.252039)
        # 2. Run deploy script in check mode: --check
        #    This will validate firmware compatibility automatically
        # 3. If servers have older firmware, either:
        #    - Upgrade server firmware first, OR
        #    - Disable this policy and re-enable after upgrade
        #
        # See: roles/intersight_ucs_provision/library/deploy_intersight_ucs.py --check
        # =========================================================
        # pcie_connectivity:
        #   - name: PCIe-Connectivity
        #     target_platform: FIAttached
        power:
          - name: Server
            power_restore: LastState
            target_platform: FIAttached
        storage:
          - name: ModelCache
            storage_template: model_cache
        thermal:
          - fan_control_mode: Balanced
            name: Balanced
        virtual_media:
          - enable_low_power_usb: true
            enable_virtual_media_encryption: true
            name: vMedia
