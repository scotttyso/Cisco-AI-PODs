---
# yaml-language-server: $schema=../../../schema/cisco-ai-pods.json
# Organizations and resource groups. Targets are claimed into the default organization and the built-in default
# resource group (which always contains every target). To give servers their own organization, add a resource group
# with those targets and an organization that uses it, for example:
#
#    organizations:
#      - name: Production
#        resource_groups:
#          - Production
#    resource_groups:
#      - name: Production
#        resources:
#          targets:
#            - ucs-c240-1
intersight:
  system:
    organizations:
      - name: default
        resource_groups:
          - default
    resource_groups:
      - name: default
        resources:
          targets:
            - ucs-domain-1
            - ucs-c240-1
