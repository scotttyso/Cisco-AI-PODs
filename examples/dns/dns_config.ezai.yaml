# yaml-language-server: $schema=../../schema/cisco-ai-pods.json
# DNS Manager configuration, normally written by Generate Configuration on the DNS Manager page.
# Passwords are not stored here. Active Directory with use_shared_ldap: true uses the bind password saved under
# Initial Inventory > Shared services; other providers use the credentials stored in the vault on the DNS Manager page.
dns:
  providers:
    ad_primary:
      type: active_directory
      use_shared_ldap: true
      server: dc1.example.com
      domain: example.com
      bind_dn: CN=dns-automation,CN=Users,DC=example,DC=com
      ldap_port: 389
      secure_ldap_port: 636
      use_ssl: false
      timeout: 10
  records:
    - hostname: node1.example.com
      ipv4: 198.18.0.1
    - hostname: api.cluster.example.com
      ipv4: 198.18.0.9
    - hostname: "*.apps.cluster.example.com"
      ipv4: 198.18.0.10
