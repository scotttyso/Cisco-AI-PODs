---
############################
# Certificates
############################
- name: Settings > Access > Certificates > SSL Certificate | for {{ array_fqdn }}
  purestorage.flasharray.purefa_certs:
    api_token: "{{ api_token }}"
    disable_warnings: "{{ disable_certificate_warnings | default(true) | bool }}"
    fa_url: "{{ array_url }}"
    certificate: "{{ lookup('file', lookup('ansible.builtin.env', 'cert_mgmt_certificate_{{ element.certificate_file }}')) }}"
    intermediate_cert: >-
      {{ lookup('file', lookup('ansible.builtin.env', 'cert_mgmt_intermediate_certificate_{{ element.intermediate_certificate_file }}')) if element.intermediate_certificate_file is defined else omit }}
    key: "{{ lookup('file', lookup('ansible.builtin.env', 'cert_mgmt_private_key_{{ element.private_key_file }}')) if element.private_key_file is defined else omit }}"
    passphrase: "{{ lookup('ansible.builtin.env', 'cert_mgmt_passphrase_{{ element.private_key_passphrase }}') | default(omit) }}"
    state: "{{ element.state | default('present') }}"
  loop_control:
    loop_var: element
  loop: "{{ security.certificates.array_certificates }}"
  when: security.certificates is defined and security.certificates.array_certificates is defined and array_fqdn in element.array_fqdns

############################
# Directory Service
############################
- name: Set Directory Service Fact
  set_fact:
    _ds: "{{ security.directory_service | default({}) }}"

- name: Settings > Security > Directory Service > Role Mappings Purity Version < 6.6.3 | for {{ array_fqdn }}
  purestorage.flasharray.purefa_dsrole_old:
    api_token: "{{ api_token }}"
    disable_warnings: "{{ disable_certificate_warnings | default(true) | bool }}"
    fa_url: "{{ array_url }}"
    group: "{{ element.group | ansible.builtin.regex_replace('^[cC][nN]=', '') if element.group is defined else omit }}"
    group_base: >-
      {{ element.group_base | ansible.builtin.regex_replace((_ds.configuration.base_dn | regex_escape) + '$', '') if element.group_base is defined else omit }}
    role: "{{ element.role | default('readonly') }}"
    state: "{{ element.state | default('present') }}"
  loop_control:
    loop_var: element
  loop: "{{ _ds.role_mappings }}"
  when: _ds.configuration is defined and _ds.role_mappings is defined and array_version < '6.6.3'

- name: Settings > Security > Directory Service > Role Mappings Purity Version 6.6.3+ | for {{ array_fqdn }}
  purestorage.flasharray.purefa_dsrole:
    api_token: "{{ api_token }}"
    disable_warnings: "{{ disable_certificate_warnings | default(true) | bool }}"
    fa_url: "{{ array_url }}"
    group: "{{ element.group | ansible.builtin.regex_replace('^[cC][nN]=', '') if element.group is defined else omit }}"
    group_base: >-
      {{ element.group_base | ansible.builtin.regex_replace((_ds.configuration.base_dn | regex_escape) + '$', '') if element.group_base is defined else omit }}
    role: "{{ element.role | default('readonly') }}"
    state: "{{ element.state | default('present') }}"
  loop_control:
    loop_var: element
  loop: "{{ _ds.role_mappings }}"
  when: _ds.configuration is defined and _ds.role_mappings is defined and array_version >= '6.6.3'

- name: Settings > Security > Directory Service > Configuration | for {{ array_fqdn }}
  purestorage.flasharray.purefa_ds:
    api_token: "{{ api_token }}"
    disable_warnings: "{{ disable_certificate_warnings | default(true) | bool }}"
    fa_url: "{{ array_url }}"
    base_dn: "{{ element.base_dn }}"
    bind_password: "{{ lookup('ansible.builtin.env', 'binding_parameters_password_{{ element.bind_password }}') }}"
    bind_user: >-
      {{ element.bind_user.split(',')[0] | ansible.builtin.regex_replace('^[cC][nN]=', '') }}
    dstype: "{{ element.type | default('management') }}"
    enable: "{{ element.enabled | default(true) }}"
    state: "{{ element.state | default('present') }}"
    uri: "{{ element.uri_list }}"
    user_login: "{{ element.user_login_attribute | default('sAMAccountName') }}"
    user_object: "{{ element.user_object_class | default('User') }}"
  loop_control:
    loop_var: element
  loop: "{{ _ds.configuration }}"
  when: _ds.configuration is defined
