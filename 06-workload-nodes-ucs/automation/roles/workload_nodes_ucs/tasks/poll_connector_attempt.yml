---
- name: "UCS/Intersight: log in for fresh UCS-X Direct polling attempt"
  ansible.builtin.uri:
    url: "https://{{ ucs_poll_endpoint.ip }}/Login"
    method: POST
    body_format: json
    body:
      User: "{{ ucs_poll_endpoint.user }}"
      Password: "{{ lookup('vars', ucs_poll_endpoint.password_var) }}"
    validate_certs: "{{ ucs_connector_validate_certs }}"
    status_code: 200
    return_content: true
    timeout: 30
  register: ucs_poll_domain_login
  when: ucs_claim_target.platform == 'domain'
  no_log: true

- name: "UCS/Intersight: create fresh standalone Redfish polling session"
  ansible.builtin.uri:
    url: "https://{{ ucs_poll_endpoint.ip }}/redfish/v1/SessionService/Sessions"
    method: POST
    body_format: json
    body:
      UserName: "{{ ucs_poll_endpoint.user }}"
      Password: "{{ lookup('vars', ucs_poll_endpoint.password_var) }}"
    validate_certs: "{{ ucs_connector_validate_certs }}"
    status_code: 201
    return_content: false
    timeout: 30
  register: ucs_poll_standalone_login
  when: ucs_claim_target.platform == 'standalone'
  no_log: true

- name: "UCS/Intersight: read connector ownership in fresh polling session"
  ansible.builtin.uri:
    url: "https://{{ ucs_poll_endpoint.ip }}/connector/Systems"
    method: GET
    headers: >-
      {{
        {'Cookie': 'sessionId=' ~ (ucs_poll_domain_login.content | from_json).SessionId,
         'Cache-Control': 'no-cache'}
        if ucs_claim_target.platform == 'domain'
        else {'X-Auth-Token': ucs_poll_standalone_login.x_auth_token,
              'Cache-Control': 'no-cache'}
      }}
    validate_certs: "{{ ucs_connector_validate_certs }}"
    status_code: 200
    return_content: true
    timeout: 30
  register: ucs_poll_connector_raw
  until: >-
    (
      ((ucs_poll_connector_raw.content | from_json) | first)
      if ((ucs_poll_connector_raw.content | from_json) is sequence and
          (ucs_poll_connector_raw.content | from_json) is not mapping)
      else (ucs_poll_connector_raw.content | from_json)
    ).AccountOwnershipState | default('') | lower | trim == ucs_poll_expected_state
  retries: "{{ ucs_connector_poll_retries }}"
  delay: "{{ ucs_connector_poll_delay_seconds }}"
  failed_when: false
  changed_when: false
  no_log: true

- name: "UCS/Intersight: normalize fresh connector ownership result"
  ansible.builtin.set_fact:
    ucs_polled_connector: >-
      {{
        ((ucs_poll_connector_raw.content | from_json) | first)
        if ((ucs_poll_connector_raw.content | from_json) is sequence and
            (ucs_poll_connector_raw.content | from_json) is not mapping)
        else (ucs_poll_connector_raw.content | from_json)
      }}
  no_log: true

- name: "UCS/Intersight: record whether expected ownership is visible"
  ansible.builtin.set_fact:
    ucs_poll_complete: >-
      {{
        ucs_polled_connector.AccountOwnershipState | default('') |
        lower | trim == ucs_poll_expected_state
      }}
  no_log: true

- name: "UCS/Intersight: delete fresh standalone polling session"
  ansible.builtin.uri:
    url: >-
      {{
        ucs_poll_standalone_login.location
        if ucs_poll_standalone_login.location is match('^https?://')
        else 'https://' ~ ucs_poll_endpoint.ip ~ ucs_poll_standalone_login.location
      }}
    method: DELETE
    headers:
      X-Auth-Token: "{{ ucs_poll_standalone_login.x_auth_token }}"
    validate_certs: "{{ ucs_connector_validate_certs }}"
    status_code: [200, 204]
    return_content: false
    timeout: 30
  when: ucs_claim_target.platform == 'standalone'
  changed_when: false
  no_log: true

- name: "UCS/Intersight: advance the fresh polling cycle counter"
  ansible.builtin.set_fact:
    ucs_poll_cycle: "{{ (ucs_poll_cycle | int) + 1 }}"
  when: not (ucs_poll_complete | bool)
  no_log: true

- name: "UCS/Intersight: retry with a new authentication-session cycle"
  ansible.builtin.include_tasks: poll_connector_attempt.yml
  when:
    - not (ucs_poll_complete | bool)
    - (ucs_poll_cycle | int) < (ucs_connector_poll_cycles | int)
