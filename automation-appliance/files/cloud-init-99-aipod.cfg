# Only OpenShift Virtualization / KubeVirt style seeds; cloud-init stays disabled on VMware.
datasource_list: [NoCloud, ConfigDrive]
# aipod-config owns the network so the DHCP server role gets a predictable static interface.
network:
  config: disabled
# Do not create the distribution default "cloud-user"; the build administrator already exists.
users: []
ssh_pwauth: true
