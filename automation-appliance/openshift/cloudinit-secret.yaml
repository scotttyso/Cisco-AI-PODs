# cloud-init NoCloud user-data. aipod-config applies /etc/aipod/appliance.env on first boot.
# Create with: oc apply -f cloudinit-secret.yaml (do not commit real passwords).
apiVersion: v1
kind: Secret
metadata:
  name: aipod-automation-cloudinit
  namespace: aipod-automation
type: Opaque
stringData:
  userdata: |
    #cloud-config
    users:
      - name: aipod
        lock_passwd: false
        ssh_authorized_keys:
          - ssh-ed25519 AAAA...replace-me
    write_files:
      - path: /etc/aipod/appliance.env
        permissions: "0600"
        content: |
          HOSTNAME=aipod-automation
          DOMAIN=example.com
          IP_SOURCE=STATIC
          IP_ADDRESS=192.0.2.10
          PREFIX=24
          GATEWAY=192.0.2.1
          DNS_SERVERS=192.0.2.53,192.0.2.54
          DNS_SEARCH=example.com
          NTP_SERVERS=0.pool.ntp.org,1.pool.ntp.org
          TIMEZONE=Etc/UTC
          ADMIN_PASSWORD=replace-with-12-plus-characters
          UI_ADMIN_USER=admin
          UI_ADMIN_PASSWORD=replace-with-12-plus-characters
