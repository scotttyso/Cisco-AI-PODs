---
- name: Load DHCP Variables From File
  when: dhcp_vars_file | length > 0
  block:
    - name: Verify DHCP Variable File Exists
      ansible.builtin.stat:
        path: "{{ dhcp_vars_file }}"
      register: dhcp_vars_stat
      delegate_to: localhost
      become: false

    - name: Fail When DHCP Variable File Is Missing
      ansible.builtin.fail:
        msg: "dhcp_vars_file '{{ dhcp_vars_file }}' was not found."
      when: not dhcp_vars_stat.stat.exists

    - name: Set DHCP Object From Variable File
      ansible.builtin.set_fact:
        dhcp: "{{ (lookup('ansible.builtin.file', dhcp_vars_file) | from_yaml).dhcp }}"

- name: Validate Required DHCP Data
  ansible.builtin.assert:
    that:
      - dhcp is mapping
      - dhcp.subnets is defined
      - dhcp.subnets | length > 0
    fail_msg: "The 'dhcp' object must define at least one entry under 'subnets'."

- name: Validate Static Reservations Reference a Known Subnet
  ansible.builtin.assert:
    that:
      - item.mac is defined
      - item.ip is defined
      - item.subnet is not defined or item.subnet in (dhcp.subnets | map(attribute='name') | list)
    fail_msg: "Reservation '{{ item.hostname | default(item.mac | default('unnamed')) }}' is invalid."
  loop: "{{ dhcp.reservations | default([]) }}"
  loop_control:
    label: "{{ item.hostname | default(item.mac | default('unnamed')) }}"

- name: Require Explicit Listen Interfaces Before Installing Kea
  when: not dhcp_render_only | bool
  ansible.builtin.assert:
    that:
      - dhcp.interfaces is defined
      - dhcp.interfaces | length > 0
      - "'*' not in dhcp.interfaces"
      - dhcp.interfaces | difference(ansible_facts.interfaces) | length == 0
    fail_msg: >-
      Set 'dhcp.interfaces' to the host interface(s) facing the bootstrap network or DHCP relay
      (found: {{ dhcp.interfaces | default([]) }}; this host has: {{ ansible_facts.interfaces | sort | join(', ') }}).
      Kea will not be installed to listen on every interface.

- name: Render Kea Configuration Only
  when: dhcp_render_only | bool
  ansible.builtin.template:
    src: kea-dhcp4.conf.j2
    dest: "{{ dhcp_render_dest | default(dhcp_config_path, true) }}"
    mode: '0640'

- name: Install and Configure Kea
  when: not dhcp_render_only | bool
  block:
    - name: Install Kea DHCPv4 Packages (EL)
      ansible.builtin.dnf:
        name: "{{ dhcp_packages }}"
        state: present
      when: ansible_facts.os_family == 'RedHat'

    - name: Install Kea DHCPv4 Packages (Debian/Ubuntu)
      ansible.builtin.apt:
        name: "{{ dhcp_packages }}"
        state: present
        update_cache: true
      when: ansible_facts.os_family == 'Debian'

    - name: Detect Kea Version
      ansible.builtin.command: kea-dhcp4 -v
      register: dhcp_kea_version_cmd
      changed_when: false

    - name: Record Kea Version
      ansible.builtin.set_fact:
        dhcp_kea_version: "{{ dhcp_kea_version_cmd.stdout | trim | regex_search('^[0-9]+\\.[0-9]+\\.[0-9]+') }}"

    - name: Read Kea Configuration Directory Ownership
      ansible.builtin.stat:
        path: "{{ dhcp_config_path | dirname }}"
      register: dhcp_config_dir

    - name: Render kea-dhcp4.conf
      ansible.builtin.template:
        src: kea-dhcp4.conf.j2
        dest: "{{ dhcp_config_path }}"
        owner: root
        group: "{{ dhcp_config_dir.stat.gr_name | default('root') }}"
        mode: '0640'
        backup: true
        validate: 'kea-dhcp4 -t %s'
      notify: Restart DHCP Service

    - name: Enable and Start DHCP Service
      ansible.builtin.systemd:
        name: "{{ dhcp_service_name }}"
        enabled: "{{ dhcp_service_enabled }}"
        state: "{{ dhcp_service_state }}"
        daemon_reload: true

- name: Configure Host Firewall (firewalld)
  when:
    - dhcp_manage_firewall | bool
    - not dhcp_render_only | bool
    - ansible_facts.os_family == 'RedHat'
  block:
    - name: Ensure firewalld Is Installed
      ansible.builtin.dnf:
        name: firewalld
        state: present

    - name: Ensure firewalld Is Running
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started

    - name: Open Firewall Services for DHCP
      ansible.posix.firewalld:
        service: "{{ item }}"
        zone: "{{ dhcp_firewall_zone | default(omit, true) }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ dhcp_firewall_services }}"

- name: Configure Host Firewall (ufw)
  when:
    - dhcp_manage_firewall | bool
    - not dhcp_render_only | bool
    - ansible_facts.os_family == 'Debian'
  block:
    - name: Check Whether ufw Is Installed
      ansible.builtin.command: which ufw
      register: dhcp_ufw
      changed_when: false
      failed_when: false

    - name: Allow DHCP Through ufw
      community.general.ufw:
        rule: allow
        port: '67'
        proto: udp
      when: dhcp_ufw.rc == 0
