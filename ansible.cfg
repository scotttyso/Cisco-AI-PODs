# Existing top-level roles resolve from ./roles. Workflow stages merged from
# Cisco-AI-PODs-DEV use cisco.aipod.* FQCNs, which resolve after running
# scripts/build_collection.sh (assembles build/collection/). Third-party
# collections pinned per stage install into build/galaxy/<stage>:
#   ansible-galaxy collection install -r <NN>/automation/requirements-*.yml -p build/galaxy/<stage>
[defaults]
roles_path = ./roles:./04-storage-everpure/automation/roles:./00-environment-prep/automation/roles:./build/collection/ansible_collections/cisco/aipod/roles
collections_path = ./build/collection:./build/galaxy/01-nd-cluster:./build/galaxy/02-backend-fabric-nxos:~/.ansible/collections:/usr/share/ansible/collections
